<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Maverick Hightower — Projections</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#f4f2ee;color:#14151a;font-family:"IBM Plex Sans",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#14151a;text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:3px}
.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(16px,3vw,24px) 80px}
.mast{border-top:4px solid #14151a;border-bottom:1px solid #14151a;padding:14px 0 12px;display:flex;align-items:center;gap:12px}
.mono{font-family:"IBM Plex Mono",monospace}
.cond{font-family:"Barlow Condensed",sans-serif}
h1{margin:40px 0 0;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:clamp(56px,9vw,112px);line-height:.9;letter-spacing:-.01em;text-transform:uppercase}
.boards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:1px;background:#14151a;border:1px solid #14151a;margin-top:40px}
.board{background:#f4f2ee;padding:28px 24px;display:flex;flex-direction:column;gap:10px;min-height:190px}
.board .name{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:44px;line-height:1;text-transform:uppercase}
.board .head{font-size:16px;font-weight:600;line-height:1.35;text-wrap:pretty}
.board .sub{font-family:"IBM Plex Mono",monospace;font-size:12px;color:#6b6e7a;line-height:1.5}
.board .meta{font-family:"IBM Plex Mono",monospace;font-size:11px;color:#6b6e7a;margin-top:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stale{background:#b0341f;color:#f4f2ee;padding:2px 7px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:10px}
.links{display:flex;gap:14px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
footer{margin-top:56px;border-top:1px solid #14151a;padding-top:16px;font-family:"IBM Plex Mono",monospace;font-size:12px;color:#6b6e7a;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
</style></head>
<body>
<div class="wrap">
  <header class="mast">
    <span class="cond" style="width:36px;height:36px;background:#14151a;color:#f4f2ee;display:grid;place-items:center;font-weight:800;font-size:18px">MH</span>
    <span style="display:flex;flex-direction:column;line-height:1.1"><span style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#6b6e7a">Maverick Hightower</span><span class="cond" style="font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase">Projections</span></span>
  </header>
  <h1>Three boards.<br>Updated daily.</h1>
  <nav class="boards" id="boards">
    <a class="board" href="https://nhl.maverickhightower.com/" data-sport="nhl"><span class="name">NHL</span><span class="head">Loading tonight's board…</span><span class="sub"></span><span class="meta"></span></a>
    <a class="board" href="https://epl.maverickhightower.com/" data-sport="epl"><span class="name">EPL</span><span class="head">Loading this week's board…</span><span class="sub"></span><span class="meta"></span></a>
    <a class="board" href="https://cbb.maverickhightower.com/" data-sport="cbb"><span class="name">CBB</span><span class="head">Loading tonight's board…</span><span class="sub"></span><span class="meta"></span></a>
  </nav>
  <footer><span>© 2026 Maverick Hightower</span><span>Every number is a model projection. No edge here is a demonstrated edge, and no bet is ever placed.</span></footer>
</div>
<script type="module">
  import { SPORTS, hubLine } from "./lib/sports.js";
  const local = !/maverickhightower\.com$/.test(location.hostname);
  const get = async (url) => { try { const r = await fetch(url, { cache: "no-store" }); return r.ok ? r.json() : null; } catch { return null; } };
  for (const a of document.querySelectorAll("[data-sport]")) {
    const k = a.dataset.sport, s = SPORTS[k];
    const base = local ? s.sample.replace(/board\.json$/, "") : `${s.host}data/`;
    const [board, results] = await Promise.all([get(`${base}board.json`), get(`${base}results.json`)]);
    const line = hubLine(k, board, results);
    a.querySelector(".head").textContent = line.headline;
    a.querySelector(".sub").textContent = line.detail || "";
    const meta = a.querySelector(".meta");
    meta.innerHTML = "";
    if (line.updated) meta.append(Object.assign(document.createElement("span"), { textContent: `Updated ${line.updated}` }));
    if (line.stale) meta.append(Object.assign(document.createElement("span"), { className: "stale", textContent: board ? "Feed stale" : "Feed down" }));
    const links = document.createElement("span"); links.className = "links";
    for (const [t, p] of [["Results", "Results.dc.html"], ["Archive", "Archive.dc.html"]]) { const l = document.createElement("a"); l.href = `${s.host}${p}`; l.textContent = t; links.append(l); }
    meta.append(links);
  }
</script>
</body></html>
